# Project environment (macOS arm64 tested). Create once from the repository root:
#   conda env create --prefix ./.conda --file environment.yml
#   conda activate "$PWD/.conda"
name: ee202a-audio
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - "pandas>=2,<3"
      - -r requirements-pretrained.txt
